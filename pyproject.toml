[project]
name = "funnel"
version = "0.1.0"
description = "HR Resume Processing & Ranking System"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    
    # PDF Parsing
    "pdfplumber>=0.11",
    "pymupdf>=1.23",
    
    # LLM
    "openai>=1.30",
    "tenacity>=8.2",
    "jinja2>=3.1",
    
    # API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    
    # Utilities
    "python-json-logger>=2.0",
    "rich>=13.7",
    "typer>=0.12",
    
    # Validation
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "faker>=25.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "T20"]
ignore = ["E501", "B008"]
src = ["funnel"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.setuptools.packages.find]
where = ["."]
include = ["funnel*"]

[tool.coverage.run]
source = ["funnel"]
omit = ["tests/*", "*/__pycache__/*"]